<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>allpipes</title>
<link rel="icon" id="favicon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@500;600&family=Overpass:wght@400;600;700&family=Overpass+Mono:wght@400;600&display=swap">
<style>
:root {
  --paper: #eef1f1;
  --surface: #f8faf9;
  --ink: #161b1e;
  --ink-2: #4b5559;
  --muted: #737d83;
  --rule: #d3d9da;
  --hover: #e4e9ea;
  --run: #1766c2;
  --queue: #a3670b;
  --fail: #c3352a;
  --pass: #1c7c44;
  --idle: #7d878c;
  --font-mark: "Martian Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-ui: "Overpass", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-data: "Overpass Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #101416;
    --surface: #161b1e;
    --ink: #e3e8e9;
    --ink-2: #aab4b8;
    --muted: #768186;
    --rule: #263034;
    --hover: #1a2226;
    --run: #5ea8f2;
    --queue: #e0aa4c;
    --fail: #ef6c5d;
    --pass: #53bf84;
    --idle: #7f8a8f;
    color-scheme: dark;
  }
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 var(--font-ui); }
a { color: inherit; text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 2px; }
[hidden] { display: none !important; }
.wrap { max-width: 1760px; margin: 0 auto; padding-inline: clamp(16px, 3vw, 36px); }
.mono { font-family: var(--font-data); }
.muted { color: var(--muted); }

.c-running { --c: var(--run); }
.c-queued { --c: var(--queue); }
.c-failed { --c: var(--fail); }
.c-passed { --c: var(--pass); }
.c-other { --c: var(--idle); }

.top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--paper) 90%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--rule); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 24px; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { width: 22px; height: 22px; flex: none; }
.wordmark { font: 600 16px/1 var(--font-mark); letter-spacing: -0.03em; }
.slash { color: var(--muted); font: 16px/1 var(--font-mark); }
.group { font-weight: 600; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conn { display: flex; align-items: center; gap: 8px; margin-left: auto; font: 13px/1 var(--font-data); color: var(--muted); white-space: nowrap; }
.conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--muted)); }
.actions { display: flex; gap: 8px; }
.chip, .btn { display: inline-flex; align-items: center; gap: 7px; padding: 7px 11px 5px; border-radius: 3px; font-size: 13.5px; font-weight: 600; line-height: 1.2; }
.chip { border: 1px solid var(--rule); background: transparent; color: var(--ink-2); }
.chip:hover { border-color: var(--muted); color: var(--ink); }
.chip[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); background: var(--surface); }
.chip i { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid currentColor; margin-top: -2px; }
.chip[aria-pressed="true"] i { background: var(--pass); border-color: var(--pass); }
.chip:disabled { opacity: .5; cursor: not-allowed; }
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--paper); }
.btn:hover { background: var(--ink-2); border-color: var(--ink-2); }
.btn svg { width: 14px; height: 14px; margin-top: -2px; }
.btn.busy svg { animation: spin .8s linear infinite; }

.alert { display: flex; gap: 10px; align-items: baseline; margin-top: 18px; padding: 10px 14px 8px; border: 1px solid color-mix(in srgb, var(--fail) 45%, transparent); background: color-mix(in srgb, var(--fail) 8%, var(--paper)); border-radius: 3px; font-size: 14px; }
.alert strong { color: var(--fail); white-space: nowrap; }
.alert span { min-width: 0; overflow-wrap: anywhere; }

.gauge { display: grid; gap: 14px; padding-block: 24px 20px; }
.pipe { display: flex; gap: 3px; height: 14px; border-radius: 7px; overflow: hidden; background: var(--rule); }
.pipe span { flex: var(--n) 1 0; min-width: 8px; background-color: var(--c); background-image: linear-gradient(to bottom, rgb(255 255 255 / .32), rgb(255 255 255 / 0) 55%, rgb(0 0 0 / .12)); }
.pipe span.flow { background-image: linear-gradient(to bottom, rgb(255 255 255 / .32), rgb(255 255 255 / 0) 55%, rgb(0 0 0 / .12)), repeating-linear-gradient(90deg, rgb(255 255 255 / 0) 0 10px, rgb(255 255 255 / .38) 10px 14px); animation: flow .9s linear infinite; }
@keyframes flow { from { background-position: 0 0, 0 0; } to { background-position: 0 0, 14px 0; } }
.readout { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 30px; }
.tally { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 0; padding: 0; list-style: none; }
.tally li { display: flex; align-items: baseline; gap: 8px; color: var(--muted); font-size: 13.5px; }
.tally b { font: 500 24px/1 var(--font-mark); color: var(--c); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.tally li.zero b { color: var(--rule); }
.scope { margin: 0 0 0 auto; font: 13px var(--font-data); color: var(--muted); }

.board { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 32px; align-items: start; padding-bottom: 56px; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; padding-bottom: 10px; border-bottom: 2px solid var(--ink); }
.tabs { display: flex; flex-wrap: wrap; gap: 2px; }
.tab { border: 0; background: none; padding: 8px 11px 6px; border-radius: 3px; color: var(--ink-2); font-weight: 600; font-size: 14.5px; }
.tab:hover { background: var(--hover); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--paper); }
.tab span { margin-left: 7px; font: 12.5px var(--font-data); opacity: .7; font-variant-numeric: tabular-nums; }
.search { display: flex; align-items: center; gap: 8px; margin-left: auto; flex: 0 1 300px; min-width: 200px; padding: 0 10px; border: 1px solid var(--rule); border-radius: 3px; background: var(--surface); }
.search:focus-within { border-color: var(--ink); }
.search kbd { font: 11.5px/1.5 var(--font-data); color: var(--muted); border: 1px solid var(--rule); border-radius: 2px; padding: 0 5px; }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--ink); font: 14px var(--font-ui); padding: 8px 0 6px; }
.search input::placeholder { color: var(--muted); }
.toggle { display: flex; align-items: center; gap: 7px; font-size: 14px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.toggle input { accent-color: var(--ink); margin: 0 0 2px; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { padding: 14px 10px 8px; text-align: left; font: 600 11px/1 var(--font-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
td { padding: 9px 10px 7px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
tbody tr:hover td { background: var(--hover); }
.num { text-align: right; font-family: var(--font-data); font-variant-numeric: tabular-nums; }
td.live { color: var(--run); }
.st { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px 1px 6px; border-radius: 3px; color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent); font-size: 12.5px; font-weight: 700; line-height: 1.5; }
.st svg { width: 12px; height: 12px; flex: none; margin-top: -2px; }
.st.spin svg { animation: spin 1.1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.proj { display: inline-block; max-width: 30ch; overflow: hidden; text-overflow: ellipsis; vertical-align: top; }
.proj .ns { color: var(--muted); }
.proj b { font-weight: 700; }
.refcell { display: flex; align-items: baseline; gap: 10px; }
.ref { max-width: 22ch; overflow: hidden; text-overflow: ellipsis; font: 13.5px var(--font-data); }
.sha { font: 12.5px var(--font-data); color: var(--muted); }
.pid { font: 13.5px var(--font-data); color: var(--ink-2); }
.who { max-width: 18ch; overflow: hidden; text-overflow: ellipsis; }
tr.empty td { padding: 56px 0; text-align: center; color: var(--muted); white-space: normal; }
tr.empty:hover td { background: none; }
tr.head th { padding: 22px 10px 8px; text-transform: none; letter-spacing: 0; font: 600 14.5px/1.3 var(--font-ui); color: var(--ink); border-bottom: 1px solid var(--rule); }
tr.head .count { margin-left: 10px; font: 12.5px var(--font-data); color: var(--muted); }
.history { display: inline-flex; gap: 3px; margin-left: 14px; vertical-align: 1px; }
.history i { width: 9px; height: 9px; border-radius: 2px; background: var(--c); }
.grid.grouped .c-project { display: none; }

.log { position: sticky; top: 72px; max-height: calc(100vh - 96px); overflow: auto; padding-left: 24px; border-left: 1px solid var(--rule); }
.log h2 { display: flex; justify-content: space-between; margin: 12px 0 6px; font: 600 11px/1 var(--font-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.log h2 span { font-family: var(--font-data); letter-spacing: 0; }
.log ol { margin: 0; padding: 0; list-style: none; }
.log li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 1px 12px; padding: 10px 0 8px; border-bottom: 1px solid var(--rule); font-size: 13.5px; }
.log time { grid-row: span 2; font: 12px/1.7 var(--font-data); color: var(--muted); }
.log .what { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log .what .mono { margin-left: 6px; font-size: 12.5px; color: var(--muted); }
.log .how { font: 12.5px var(--font-data); color: var(--muted); }
.log .how span { color: var(--c); font-weight: 600; }
.log li.none { display: block; padding: 14px 0; color: var(--muted); border: 0; }

.toasts { position: fixed; right: 16px; bottom: 16px; z-index: 10; display: grid; gap: 8px; width: min(400px, calc(100vw - 32px)); }
.toast { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 12px; padding: 12px 12px 10px 14px; background: var(--surface); border: 1px solid var(--rule); border-radius: 3px; box-shadow: 0 10px 30px rgb(0 0 0 / .14); animation: rise .18s ease-out; }
.toast > svg { width: 16px; height: 16px; color: var(--c); margin-top: -2px; }
.toast strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toast strong em { font-style: normal; color: var(--c); }
.toast small { display: block; font: 12.5px var(--font-data); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toast a { font-size: 13.5px; font-weight: 600; }
.toast button { border: 0; background: none; color: var(--muted); font-size: 18px; line-height: 1; padding: 2px 4px; }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } }

@media (max-width: 1680px) {
  .board { grid-template-columns: minmax(0, 1fr); }
  .log { position: static; max-height: none; overflow: visible; padding: 8px 0 0; border-left: 0; border-top: 2px solid var(--ink); }
}
@media (max-width: 1180px) {
  .c-src { display: none; }
}
@media (max-width: 900px) {
  .c-author, .c-upd { display: none; }
}
@media (max-width: 760px) {
  .c-pid, .sha { display: none; }
  .proj { max-width: 18ch; }
  .ref { max-width: 12ch; }
  .conn { margin-left: 0; order: 3; width: 100%; }
  .search { flex-basis: 100%; margin-left: 0; }
  .scope { margin-left: 0; }
  .tally { gap: 8px 20px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; }
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" aria-hidden="true"><path d="M3.5 6H9a5 5 0 0 1 5 5v6.5" stroke-width="3.6"/><path d="M2.5 2v8M10 17.5h8" stroke-width="2.2"/></svg>
      <span class="wordmark">allpipes</span>
      <span class="slash">/</span>
      <a id="group" class="group" target="_blank" rel="noopener">…</a>
    </div>
    <div class="conn" id="conn"><i></i><span id="conn-text">Connecting</span></div>
    <div class="actions">
      <button type="button" class="chip" id="sound-btn" aria-pressed="false"><i></i>Sound</button>
      <button type="button" class="chip" id="alerts-btn" aria-pressed="false"><i></i>Desktop alerts</button>
      <button type="button" class="btn" id="refresh-btn" title="Poll GitLab now (r)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3h-3"/></svg>
        Refresh
      </button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="alert" id="alert" role="alert" hidden><strong>GitLab</strong><span id="alert-text"></span></div>

  <section class="gauge" aria-label="Pipeline status across the group">
    <div class="pipe" id="pipe"></div>
    <div class="readout">
      <ul class="tally" id="tally"></ul>
      <p class="scope" id="scope"></p>
    </div>
  </section>

  <div class="board">
    <section>
      <div class="toolbar">
        <div class="tabs" role="tablist" id="tabs"></div>
        <label class="search"><kbd>/</kbd><input id="q" type="search" placeholder="Project, branch, SHA or author" autocomplete="off" aria-label="Filter pipelines"></label>
        <label class="toggle"><input type="checkbox" id="grouped"> Group by project</label>
      </div>
      <div class="table-wrap">
        <table class="grid" id="grid">
          <thead>
            <tr>
              <th>Status</th>
              <th class="c-project">Project</th>
              <th>Ref</th>
              <th class="c-pid">Pipeline</th>
              <th class="c-src">Trigger</th>
              <th class="c-author">Author</th>
              <th class="num">Duration</th>
              <th class="num c-upd">Updated</th>
            </tr>
          </thead>
          <tbody id="rows"><tr class="empty"><td colspan="8">Connecting to allpipes…</td></tr></tbody>
        </table>
      </div>
    </section>

    <aside class="log" aria-label="Activity">
      <h2>Activity <span id="log-count"></span></h2>
      <ol id="log"></ol>
    </aside>
  </div>
</main>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
const $ = (id) => document.getElementById(id);

const store = {
  get(key, fallback) {
    try {
      const v = localStorage.getItem('allpipes.' + key);
      return v === null ? fallback : JSON.parse(v);
    } catch { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem('allpipes.' + key, JSON.stringify(value)); } catch {}
  },
};

const STATUS = {
  running: ['running', 'running'],
  canceling: ['canceling', 'running'],
  created: ['created', 'queued'],
  pending: ['pending', 'queued'],
  preparing: ['preparing', 'queued'],
  waiting_for_resource: ['waiting', 'queued'],
  waiting_for_callback: ['callback', 'queued'],
  success: ['passed', 'passed'],
  failed: ['failed', 'failed'],
  canceled: ['canceled', 'other'],
  skipped: ['skipped', 'other'],
  manual: ['manual', 'other'],
  scheduled: ['scheduled', 'other'],
};
const status = (s) => {
  const [label, cat] = STATUS[s] || [s || 'unknown', 'other'];
  return { label, cat };
};
const isActive = (p) => ['running', 'queued'].includes(status(p.status).cat);

const SOURCES = {
  merge_request_event: 'MR',
  parent_pipeline: 'child',
  pipeline: 'upstream',
  external_pull_request_event: 'PR',
  ondemand_dast_scan: 'dast',
  security_orchestration_policy: 'policy',
};

const svg = (body) => `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;
const ICONS = {
  running: svg('<circle cx="8" cy="8" r="6" opacity=".3"/><path d="M8 2a6 6 0 0 1 6 6"/>'),
  queued: svg('<circle cx="8" cy="8" r="6" stroke-dasharray="3.2 2.8"/>'),
  passed: svg('<path d="M3.5 8.5l3 3 6-7" stroke-width="2.3"/>'),
  failed: svg('<path d="M4.5 4.5l7 7M11.5 4.5l-7 7" stroke-width="2.3"/>'),
  canceled: svg('<circle cx="8" cy="8" r="6"/><path d="M4 12l8-8"/>'),
  skipped: svg('<path d="M3 4l4 4-4 4M9 4l4 4-4 4"/>'),
  manual: svg('<path d="M5.5 3.5v9l6.5-4.5z" fill="currentColor"/>'),
  scheduled: svg('<circle cx="8" cy="8" r="6"/><path d="M8 5v3.3l2.2 1.4"/>'),
};
const icon = (s) => ICONS[s] || ICONS[status(s).cat] || svg('<circle cx="8" cy="8" r="2" fill="currentColor"/>');

const VIEWS = {
  all: { label: 'All', match: () => true, count: (s) => s.total_pipelines, empty: 'No pipelines in this group yet.' },
  active: { label: 'Active', match: isActive, count: (s) => s.active, empty: 'Nothing is running or queued right now.' },
  failed: { label: 'Failed', match: (p) => p.status === 'failed', count: (s) => s.failed, empty: 'No failed pipelines among the latest runs.' },
  passed: { label: 'Passed', match: (p) => p.status === 'success', count: (s) => s.passed, empty: 'No passed pipelines among the latest runs.' },
};
const CATEGORIES = [
  ['running', 'running'],
  ['queued', 'queued'],
  ['failed', 'failed'],
  ['passed', 'passed'],
  ['other', 'other'],
];

const state = {
  snap: null,
  view: VIEWS[store.get('view')] ? store.get('view') : 'all',
  grouped: store.get('grouped', false),
  sound: store.get('sound', false),
  alerts: store.get('alerts', false),
  connected: false,
  lastSeq: null,
};

const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = (u) => (/^https?:\/\//i.test(u || '') ? esc(u) : '#');
const ext = 'target="_blank" rel="noopener"';

function fmtDur(sec) {
  const s = Math.round(sec);
  const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, r = s % 60;
  const pad = (n) => String(n).padStart(2, '0');
  return h > 0 ? `${h}:${pad(m)}:${pad(r)}` : `${Math.floor(s / 60)}:${pad(r)}`;
}

function elapsed(p, now = Date.now()) {
  if (!isActive(p) && p.duration > 0) return p.duration;
  if (p.started_at) {
    const end = p.finished_at ? Date.parse(p.finished_at) : now;
    return Math.max(0, (end - Date.parse(p.started_at)) / 1000);
  }
  return 0;
}

function durationText(p) {
  const d = elapsed(p);
  if (d > 0) return fmtDur(d);
  return status(p.status).cat === 'queued' ? 'queued' : '–';
}

const lastActivity = (p) => Date.parse(p.finished_at || p.updated_at);

function ago(ms, now = Date.now()) {
  const d = (now - ms) / 1000;
  if (d < 60) return 'just now';
  if (d < 3600) return `${Math.floor(d / 60)}m ago`;
  if (d < 86400) return `${Math.floor(d / 3600)}h ago`;
  if (d < 604800) return `${Math.floor(d / 86400)}d ago`;
  return new Date(ms).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

const clock = (ts) => new Date(ts).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
const stamp = (ms) => new Date(ms).toLocaleString();

function relPath(p) {
  const group = state.snap?.group?.full_path;
  const path = p.project_path || p.project_name || '';
  return group && path.startsWith(group + '/') ? path.slice(group.length + 1) : path;
}

function refLabel(ref) {
  const mr = /^refs\/merge-requests\/(\d+)\//.exec(ref || '');
  return mr ? '!' + mr[1] : ref || '';
}

function pill(s) {
  const st = status(s);
  return `<span class="st c-${st.cat}${st.cat === 'running' ? ' spin' : ''}">${icon(s)}${esc(st.label)}</span>`;
}

function projectCell(p) {
  const path = relPath(p);
  const cut = path.lastIndexOf('/');
  const ns = cut >= 0 ? `<span class="ns">${esc(path.slice(0, cut + 1))}</span>` : '';
  return `<a class="proj" href="${safeUrl(p.project_web_url)}" ${ext}>${ns}<b>${esc(path.slice(cut + 1))}</b></a>`;
}

function refCell(p) {
  const label = esc(refLabel(p.ref));
  const mr = /^refs\/merge-requests\/(\d+)\//.exec(p.ref || '');
  const ref = mr
    ? `<a class="ref" href="${safeUrl(p.project_web_url)}/-/merge_requests/${mr[1]}" ${ext} title="${esc(p.ref)}">${label}</a>`
    : `<span class="ref" title="${esc(p.ref)}">${label}</span>`;
  const sha = p.sha ? `<a class="sha" href="${safeUrl(p.project_web_url)}/-/commit/${esc(p.sha)}" ${ext}>${esc(p.sha.slice(0, 8))}</a>` : '';
  return `<div class="refcell">${ref}${sha}</div>`;
}

function row(p) {
  const live = status(p.status).cat === 'running' && p.started_at;
  const last = lastActivity(p);
  return `<tr>
    <td>${pill(p.status)}</td>
    <td class="c-project">${projectCell(p)}</td>
    <td>${refCell(p)}</td>
    <td class="c-pid"><a class="pid" href="${safeUrl(p.web_url)}" ${ext}>#${esc(p.id)}</a></td>
    <td class="c-src muted">${esc(SOURCES[p.source] || p.source)}</td>
    <td class="c-author"><div class="who" title="${esc(p.user?.username)}">${esc(p.user?.name)}</div></td>
    <td class="num${live ? ' live' : ''}"${live ? ` data-start="${Date.parse(p.started_at)}"` : ''}>${durationText(p)}</td>
    <td class="num c-upd muted" data-ago="${last}" title="${esc(stamp(last))}">${ago(last)}</td>
  </tr>`;
}

function emptyRow(text) {
  return `<tr class="empty"><td colspan="8">${esc(text)}</td></tr>`;
}

function visiblePipelines() {
  const q = $('q').value.trim().toLowerCase();
  const view = VIEWS[state.view];
  return state.snap.pipelines.filter((p) => {
    if (!view.match(p)) return false;
    if (!q) return true;
    return [p.project_path, p.ref, refLabel(p.ref), p.sha, String(p.id), p.status, p.user?.name, p.user?.username]
      .some((f) => (f || '').toLowerCase().includes(q));
  });
}

function renderTable() {
  const snap = state.snap;
  const rows = $('rows');
  $('grid').classList.toggle('grouped', state.grouped);
  if (!snap) return;
  if (!snap.ready) {
    rows.innerHTML = emptyRow(snap.error ? 'Waiting for GitLab to respond. See the message above.' : `Loading pipelines from ${snap.group.full_path}…`);
    return;
  }
  const list = visiblePipelines();
  if (!list.length) {
    const q = $('q').value.trim();
    rows.innerHTML = emptyRow(q ? `No pipelines match “${q}”.` : snap.stats.total_projects === 0 ? 'This group has no projects.' : VIEWS[state.view].empty);
    return;
  }
  if (!state.grouped) {
    rows.innerHTML = list.map(row).join('');
    return;
  }
  const byProject = new Map();
  for (const p of list) {
    if (!byProject.has(p.project_id)) byProject.set(p.project_id, []);
    byProject.get(p.project_id).push(p);
  }
  let html = '';
  for (const [projectId, pipes] of byProject) {
    const history = snap.pipelines
      .filter((p) => p.project_id === projectId)
      .sort((a, b) => b.id - a.id)
      .map((p) => `<i class="c-${status(p.status).cat}" title="#${esc(p.id)} ${esc(status(p.status).label)} on ${esc(refLabel(p.ref))}"></i>`)
      .join('');
    html += `<tr class="head"><th colspan="8">${projectCell(pipes[0])}<span class="history">${history}</span><span class="count">${pipes.length} shown</span></th></tr>`;
    html += pipes.map(row).join('');
  }
  rows.innerHTML = html;
}

function renderTabs() {
  const stats = state.snap?.stats || {};
  $('tabs').innerHTML = Object.entries(VIEWS).map(([key, v], i) =>
    `<button type="button" class="tab" role="tab" aria-selected="${key === state.view}" data-view="${key}" title="${i + 1}">${v.label}<span>${v.count(stats) ?? 0}</span></button>`
  ).join('');
}

function renderGauge() {
  const s = state.snap.stats;
  const counts = { running: s.running, queued: s.queued, failed: s.failed, passed: s.passed, other: s.other };
  $('pipe').innerHTML = CATEGORIES
    .filter(([cat]) => counts[cat] > 0)
    .map(([cat, label]) => `<span class="c-${cat}${cat === 'running' ? ' flow' : ''}" style="--n:${counts[cat]}" title="${counts[cat]} ${label}"></span>`)
    .join('');
  $('pipe').setAttribute('aria-label', CATEGORIES.map(([cat, label]) => `${counts[cat]} ${label}`).join(', '));
  $('tally').innerHTML = CATEGORIES.map(([cat, label]) =>
    `<li class="c-${cat}${counts[cat] ? '' : ' zero'}"><b>${counts[cat]}</b>${label}</li>`
  ).join('');
  const each = state.snap.pipelines_per_project;
  $('scope').textContent = `${s.total_projects} projects · last ${each} pipeline${each === 1 ? '' : 's'} each`;
}

function renderLog() {
  const events = state.snap.events || [];
  $('log-count').textContent = events.length || '';
  if (!events.length) {
    $('log').innerHTML = '<li class="none">Status changes show up here as they happen.</li>';
    return;
  }
  $('log').innerHTML = events.slice(0, 60).map((e) => {
    const p = e.pipeline;
    const to = status(e.new_status);
    const from = e.previous_status ? status(e.previous_status) : null;
    const how = from
      ? `<span class="c-${from.cat}">${esc(from.label)}</span> → <span class="c-${to.cat}">${esc(to.label)}</span>`
      : `new · <span class="c-${to.cat}">${esc(to.label)}</span>`;
    return `<li>
      <time datetime="${esc(e.timestamp)}">${clock(e.timestamp)}</time>
      <div class="what"><a href="${safeUrl(p.web_url)}" ${ext}><b>${esc(relPath(p))}</b></a><span class="mono">${esc(refLabel(p.ref))}</span></div>
      <div class="how">${how}</div>
    </li>`;
  }).join('');
}

function renderConn() {
  const snap = state.snap;
  let cat = 'other', text = 'Connecting';
  if (!state.connected && snap) {
    cat = 'failed'; text = 'Reconnecting to allpipes…';
  } else if (snap && !snap.ready) {
    cat = snap.error ? 'failed' : 'queued'; text = 'Loading pipelines…';
  } else if (snap) {
    cat = snap.error ? 'failed' : 'passed';
    const secs = Math.max(0, Math.round((Date.now() - Date.parse(snap.stats.last_poll_time)) / 1000));
    text = `polled ${secs < 60 ? secs + 's' : Math.floor(secs / 60) + 'm'} ago · every ${snap.poll_interval}s`;
  }
  $('conn').className = `conn c-${cat}`;
  $('conn-text').textContent = text;
}

function renderHeader() {
  const g = state.snap.group;
  $('group').textContent = g.full_path || g.name;
  $('group').href = safeUrl(g.web_url);
  $('alert').hidden = !state.snap.error;
  $('alert-text').textContent = state.snap.error || '';
  const active = state.snap.stats.active;
  document.title = `${active ? `(${active}) ` : ''}${g.full_path} · allpipes`;
  setFavicon(state.snap.stats.running > 0 ? '--run' : '--ink');
}

let faviconToken = '';
function setFavicon(token) {
  if (token === faviconToken) return;
  faviconToken = token;
  const color = getComputedStyle(document.documentElement).getPropertyValue(token).trim() || '#161b1e';
  const mark = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="${color}"><path d="M3.5 6H9a5 5 0 0 1 5 5v6.5" stroke-width="3.6"/><path d="M2.5 2v8M10 17.5h8" stroke-width="2.2"/></svg>`;
  $('favicon').href = 'data:image/svg+xml,' + encodeURIComponent(mark);
}

function renderPrefs() {
  $('sound-btn').setAttribute('aria-pressed', state.sound);
  const btn = $('alerts-btn');
  if (!('Notification' in window)) {
    btn.hidden = true;
    return;
  }
  const denied = Notification.permission === 'denied';
  btn.disabled = denied;
  btn.title = denied ? 'Notifications are blocked in your browser settings' : 'Show a desktop notification when a pipeline passes or fails';
  btn.setAttribute('aria-pressed', state.alerts && Notification.permission === 'granted');
}

function renderAll() {
  renderTabs();
  if (!state.snap) return;
  renderHeader();
  renderConn();
  renderGauge();
  renderTable();
  renderLog();
}

let audio = null;
function chime(notes) {
  if (!state.sound) return;
  try {
    audio ||= new AudioContext();
    if (audio.state === 'suspended') audio.resume();
    const t0 = audio.currentTime + 0.02;
    for (const [freq, at, len] of notes) {
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, t0 + at);
      gain.gain.exponentialRampToValueAtTime(0.12, t0 + at + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + at + len);
      osc.connect(gain).connect(audio.destination);
      osc.start(t0 + at);
      osc.stop(t0 + at + len + 0.05);
    }
  } catch {}
}
const CHIME_PASSED = [[659, 0, 0.2], [880, 0.12, 0.35]];
const CHIME_FAILED = [[311, 0, 0.3], [233, 0.22, 0.45]];

function announce(e) {
  const p = e.pipeline;
  const st = status(e.new_status);
  const what = `${relPath(p)} ${st.label}`;
  const detail = `${refLabel(p.ref)} · #${p.id}${elapsed(p) > 0 ? ' · ' + fmtDur(elapsed(p)) : ''}`;

  const el = document.createElement('div');
  el.className = `toast c-${st.cat}`;
  el.innerHTML = `${icon(e.new_status)}
    <div><strong>${esc(relPath(p))} <em>${esc(st.label)}</em></strong><small>${esc(detail)}</small></div>
    <a href="${safeUrl(p.web_url)}" ${ext}>Open</a>
    <button type="button" aria-label="Dismiss">×</button>`;
  el.querySelector('button').addEventListener('click', () => el.remove());
  $('toasts').prepend(el);
  while ($('toasts').children.length > 4) $('toasts').lastElementChild.remove();
  setTimeout(() => el.remove(), e.new_status === 'failed' ? 20000 : 8000);

  chime(e.new_status === 'failed' ? CHIME_FAILED : CHIME_PASSED);
  if (state.alerts && 'Notification' in window && Notification.permission === 'granted') {
    try { new Notification(what, { body: detail, tag: `allpipes-${p.id}` }); } catch {}
  }
}

function apply(snap) {
  const events = snap.events || [];
  const newest = events.length ? events[0].seq : 0;
  if (state.lastSeq !== null && newest > state.lastSeq) {
    events
      .filter((e) => e.seq > state.lastSeq && (e.new_status === 'failed' || e.new_status === 'success'))
      .reverse()
      .forEach(announce);
  }
  state.lastSeq = newest;
  state.snap = snap;
  $('refresh-btn').classList.remove('busy');
  renderAll();
}

function connect() {
  const source = new EventSource('api/events');
  source.addEventListener('snapshot', (e) => {
    state.connected = true;
    try { apply(JSON.parse(e.data)); } catch (err) { console.error('allpipes: bad snapshot', err); }
  });
  source.onopen = () => { state.connected = true; renderConn(); };
  source.onerror = () => { state.connected = false; renderConn(); };
}

function setView(view) {
  if (!VIEWS[view]) return;
  state.view = view;
  store.set('view', view);
  renderTabs();
  renderTable();
}

async function refresh() {
  const btn = $('refresh-btn');
  btn.classList.add('busy');
  setTimeout(() => btn.classList.remove('busy'), 4000);
  try { await fetch('api/refresh', { method: 'POST' }); } catch {}
}

$('tabs').addEventListener('click', (e) => {
  const tab = e.target.closest('[data-view]');
  if (tab) setView(tab.dataset.view);
});
$('q').addEventListener('input', renderTable);
$('grouped').checked = state.grouped;
$('grouped').addEventListener('change', (e) => {
  state.grouped = e.target.checked;
  store.set('grouped', state.grouped);
  renderTable();
});
$('refresh-btn').addEventListener('click', refresh);
$('sound-btn').addEventListener('click', () => {
  state.sound = !state.sound;
  store.set('sound', state.sound);
  renderPrefs();
  chime(CHIME_PASSED);
});
$('alerts-btn').addEventListener('click', async () => {
  if (!state.alerts && Notification.permission !== 'granted') {
    if (await Notification.requestPermission() !== 'granted') return renderPrefs();
  }
  state.alerts = !state.alerts;
  store.set('alerts', state.alerts);
  renderPrefs();
});

document.addEventListener('keydown', (e) => {
  const typing = e.target.matches('input, textarea, select');
  const plain = !e.metaKey && !e.ctrlKey && !e.altKey;
  if (e.key === 'Escape' && e.target === $('q')) {
    $('q').value = '';
    $('q').blur();
    renderTable();
  } else if (typing || !plain) {
    return;
  } else if (e.key === '/') {
    e.preventDefault();
    $('q').focus();
  } else if (e.key >= '1' && e.key <= '4') {
    setView(Object.keys(VIEWS)[Number(e.key) - 1]);
  } else if (e.key === 'r') {
    refresh();
  }
});

setInterval(() => {
  const now = Date.now();
  document.querySelectorAll('[data-start]').forEach((el) => {
    el.textContent = fmtDur((now - Number(el.dataset.start)) / 1000);
  });
  document.querySelectorAll('[data-ago]').forEach((el) => {
    el.textContent = ago(Number(el.dataset.ago), now);
  });
  if (state.snap) renderConn();
}, 1000);

renderTabs();
renderPrefs();
setFavicon('--ink');
connect();
</script>
</body>
</html>
